name: AxxiomSafety
options:
  bundleIdPrefix: com.axxiomelevator
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug-Dev: debug
  Release-Dev: release
  Debug-Staging: debug
  Release-Staging: release
  Debug-Prod: debug
  Release-Prod: release
configFiles:
  Debug-Dev: Configs/Dev.xcconfig
  Release-Dev: Configs/Dev.xcconfig
  Debug-Staging: Configs/Staging.xcconfig
  Release-Staging: Configs/Staging.xcconfig
  Debug-Prod: Configs/Prod.xcconfig
  Release-Prod: Configs/Prod.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.0
targets:
  AxxiomSafety:
    type: application
    platform: iOS
    sources:
      - path: AxxiomSafety
        excludes:
          - "App/Info.plist"
    dependencies:
      - package: Supabase
        product: Auth
    settings:
      base:
        INFOPLIST_FILE: AxxiomSafety/App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - AxxiomSafetyTests
        - AxxiomSafetyUITests
      configVariants:
        - Dev
        - Staging
        - Prod
  AxxiomSafetyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AxxiomSafetyTests
    dependencies:
      - target: AxxiomSafety
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  AxxiomSafetyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AxxiomSafetyUITests
    dependencies:
      - target: AxxiomSafety
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
