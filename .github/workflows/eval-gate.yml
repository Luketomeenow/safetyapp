name: eval-gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: Eval profile
        default: release
concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    environment: eval
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            eval:
              - 'packages/core/**'
              - 'corpus/**'
              - 'packages/evals/**'
              - 'apps/api/src/routes/chat.ts'
      - if: steps.changes.outputs.eval == 'true' || github.event_name != 'pull_request'
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - if: steps.changes.outputs.eval == 'true' || github.event_name != 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: steps.changes.outputs.eval == 'true' || github.event_name != 'pull_request'
        run: pnpm install --frozen-lockfile
      - if: steps.changes.outputs.eval == 'true' || github.event_name != 'pull_request'
        name: Run evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_EVAL }}
          DATABASE_URL: ${{ secrets.EVAL_DATABASE_URL }}
          ANTHROPIC_MODEL: claude-opus-5
        run: |
          PROFILE="${{ github.event.inputs.profile || (github.event_name == 'pull_request' && 'pr' || 'release') }}"
          pnpm --filter @axxiom/evals eval -- run --profile "$PROFILE" --concurrency 4
      - if: always() && (steps.changes.outputs.eval == 'true' || github.event_name != 'pull_request')
        uses: actions/upload-artifact@v4
        with:
          name: eval-run
          path: packages/evals/runs/
          retention-days: 90
      - if: always() && github.event_name == 'pull_request' && steps.changes.outputs.eval == 'true'
        name: Comment report on the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_DIR="$(cat packages/evals/runs/latest.txt 2>/dev/null || true)"
          if [ -n "$RUN_DIR" ] && [ -f "$RUN_DIR/report.md" ]; then
            head -c 60000 "$RUN_DIR/report.md" > /tmp/report.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/report.md
          fi
