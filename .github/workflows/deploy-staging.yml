name: deploy-staging
on:
  workflow_run:
    workflows: [ci, eval-gate]
    types: [completed]
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_STAGING }}
        run: |
          npx --yes supabase@2 link --project-ref ${{ vars.SUPABASE_PROJECT_REF_STAGING }} --password "$SUPABASE_DB_PASSWORD"
          npx --yes supabase@2 db push --password "$SUPABASE_DB_PASSWORD"
      - name: Build and deploy the API
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID_STAGING }}
        run: |
          pnpm --filter @axxiom/api build
          npx --yes vercel@59 deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"
      - name: Post-deploy smoke
        env:
          SYNTHETIC_TOKEN: ${{ secrets.SYNTHETIC_TOKEN }}
        run: |
          curl -fsS https://axxiom-safety-api-staging.vercel.app/health
          curl -fsS -N --max-time 120 -H "Authorization: Bearer $SYNTHETIC_TOKEN" -H "Content-Type: application/json" \
            -X POST https://axxiom-safety-api-staging.vercel.app/v1/chat \
            -d '{"client_message_id":"ci-'"$GITHUB_RUN_ID"'","message":"When can I use a tag instead of a lock?"}' | grep -q '"kind":"answer"'
